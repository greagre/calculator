<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Б3-34 — v17</title>
<meta name="theme-color" content="#F3F2ED">
<style>
:root{
  --bg:#F3F2ED; --card:#FFFFFF; --line:#DCDCD5; --ink:#1B1B1B;
  --cell:#22261E; --cellline:#3A4232; --lbl:#7FA88A; --val:#8DFFAB;
  --green:#2E7D32; --muted:#6D6A61;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); padding:8px 8px 0;
  font:15px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
main{display:block;padding-bottom:190px}

/* режимы */
.modes{display:flex;gap:6px;margin-bottom:8px}
.modes button{
  flex:1 1 0;min-height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:600 15px/1 inherit;cursor:pointer;
}
.modes button.on{background:var(--green);border-color:var(--green);color:#fff}

/* экраны */
.screen{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.screen.on{display:block}
.scrh{font:700 12px/1 inherit;letter-spacing:.6px;color:var(--muted);margin:0 0 8px;text-transform:uppercase}

/* индикатор */
.lcd{
  background:#14180F;border-radius:12px;padding:10px 14px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;
}
.lcd .mode{color:#6F8B78;font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.5px}
.lcd .val{color:var(--val);font:700 28px/1 ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ячейки — ОДИН стиль на всё */
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:6px}
.cell{
  background:var(--cell);border:1px solid var(--cellline);border-radius:10px;
  padding:7px 2px;text-align:center;min-width:0;overflow:hidden;
}
.cell i{display:block;color:var(--lbl);font:700 10px/1.2 inherit;font-style:normal;letter-spacing:.5px;margin-bottom:3px}
.cell b{
  display:block;color:var(--val);font:700 15px/1.15 ui-monospace,Menlo,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cell.flash{background:#2C6B3F;border-color:#4D9A64}
.cell.flash b{color:#EAFFF0}

/* клавиатура */
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:10px}
.pad button{
  min-height:46px;border-radius:10px;border:1px solid #C9C6BA;background:#E4E2D8;
  color:#1B1B1B;font:600 15px/1 inherit;padding:0 2px;cursor:pointer;
}
.pad button.dark{background:#3E4238;border-color:#2E3228;color:#EDEFE6}
.pad button.op{background:#2F5D9E;border-color:#274E86;color:#fff}
.pad button.red{background:#B93B3B;border-color:#9E3030;color:#fff}
.pad button.on{outline:2px solid var(--green)}
.pad button:active{filter:brightness(.92)}

/* листинг */
.list{font:13px/1.5 ui-monospace,Menlo,monospace;max-height:44vh;overflow:auto;background:#FBFBF7;border:1px solid #E6E4DC;border-radius:10px;padding:4px}
.row{display:flex;gap:8px;padding:4px 6px;border-radius:7px;position:relative}
.row .a{color:var(--muted);width:22px;flex:0 0 22px}
.row .c{color:#B8860B;width:26px;flex:0 0 26px}
.row .t{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur{background:#DDEFD2;box-shadow:inset 3px 0 0 var(--green);padding-left:18px}
.row.cur::before{content:"\25B6";position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--green)}
.row.cur .t{font-weight:700}

/* журнал */
.log{font:12.5px/1.5 ui-monospace,Menlo,monospace;max-height:44vh;overflow:auto}
.logline{padding:3px 0;border-bottom:1px dashed #E6E4DC;color:#33362E}
.logline b{color:var(--green)}
.empty{color:var(--muted);font:14px/1.5 inherit;padding:10px 4px}

/* закреплённая панель */
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--bg);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.ctl{display:flex;gap:5px;margin-bottom:6px}
.ctl button{
  flex:1 1 0;min-height:42px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:600 13px/1 inherit;padding:0 4px;
  cursor:pointer;white-space:nowrap;overflow:hidden;
}
.ctl button.primary{background:var(--green);border-color:var(--green);color:#fff}
.ctl button.on{background:#F2C94C;border-color:#D8B03C;color:#211A00}
body.work .study-only{display:none}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.tabs button{
  min-height:42px;border-radius:10px;border:1px solid var(--line);background:#F1F0EA;
  color:var(--ink);font:600 12.5px/1.1 inherit;padding:6px 1px;cursor:pointer;white-space:nowrap;
}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}

.err{display:none;background:#ffe0e0;border:1px solid #d66;color:#700;border-radius:10px;padding:8px;margin:6px 0;font:13px/1.4 inherit}
</style>
</head>
<body class="work">

<div class="modes">
  <button data-mode="work" class="on">Работа</button>
  <button data-mode="study">Учёба</button>
</div>

<div class="err" id="err"></div>

<main>
  <!-- ЧИСЛА -->
  <section class="screen on" id="s-calc">
    <div class="lcd">
      <span class="mode" id="lcdMode">АВТ</span>
      <span class="val" id="lcdVal">0</span>
    </div>
    <div class="grid5" id="stackA"></div>
    <div class="grid5" id="regsA"></div>
    <div class="pad" id="pad"></div>
  </section>

  <!-- РЕГИСТРЫ -->
  <section class="screen" id="s-regs">
    <div class="scrh">Стек · X Y Z T X1</div>
    <div class="grid5" id="stackB"></div>
    <div class="scrh" style="margin-top:12px">Регистры · R0–Rd</div>
    <div class="grid5" id="regsB"></div>
  </section>

  <!-- КОД -->
  <section class="screen" id="s-code">
    <div class="scrh" id="codeTitle">Программа не загружена</div>
    <div class="list" id="list"></div>
  </section>

  <!-- ЖУРНАЛ -->
  <section class="screen" id="s-log">
    <div class="scrh">Журнал шагов</div>
    <div class="log" id="log"></div>
  </section>
</main>

<div class="bottom">
  <div class="ctl">
    <button id="btnStep" class="primary">▶ Шаг</button>
    <button id="btnAuto" class="study-only">Авто</button>
    <button id="btnZero" class="study-only">00</button>
    <button id="btnRun">Пуск</button>
    <button id="btnCycle">Экраны: шаг</button>
    <button id="btnDemo">Пример 5!</button>
  </div>
  <div class="tabs">
    <button data-s="calc" class="on">Числа</button>
    <button data-s="regs">Регистры</button>
    <button data-s="code">Код</button>
    <button data-s="log">Журнал</button>
  </div>
</div>

<script>
(function(){
'use strict';

window.onerror = function(m){
  var e = document.getElementById('err');
  if (e){ e.style.display = 'block'; e.textContent = 'Ошибка: ' + m; }
};

/* ---------- состояние ---------- */
var S = {X:0,Y:0,Z:0,T:0,X1:0,R:[]};
for (var i=0;i<14;i++) S.R.push(0);

var buf='', fresh=true, pendReg=null, PC=0, timer=null, runner=null, prog=null;
var cycle = true;              /* листать экраны по шагу */
var screenNow = 'calc';

var ORDER = ['calc','regs','code','log'];

function fmt(n){
  if (typeof n !== 'number' || isNaN(n) || !isFinite(n)) return 'ЕГГОГ';
  if (n === 0) return '0';
  var a = Math.abs(n);
  if (a >= 1e10 || a < 1e-9){
    var e = Math.floor(Math.log10(a));
    var m = n / Math.pow(10,e);
    var ms = m.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');
    return ms + 'e' + e;
  }
  var r = Math.round(n*1e9)/1e9;
  var s = String(r);
  if (s.length > 11) s = r.toPrecision(9);
  return s;
}
function pad2(n){ return (n<10?'0':'')+n; }

/* ---------- стек ---------- */
function lift(){ S.X1=S.T; S.T=S.Z; S.Z=S.Y; S.Y=S.X; }
function bin(op){
  var a=S.Y, b=S.X, r;
  if (op==='+') r=a+b;
  else if (op==='-') r=a-b;
  else if (op==='*') r=a*b;
  else if (op==='/') r=(b===0)?Infinity:a/b;
  else if (op==='^') r=Math.pow(a,b);
  else r=NaN;
  S.X=r; S.Y=S.Z; S.Z=S.T; S.T=S.X1; S.X1=0;
  buf = isFinite(r)?fmt(r):'';
  fresh = true;
}
function un(fn){
  S.X = fn(S.X);
  buf = isFinite(S.X)?fmt(S.X):'';
  fresh = true;
}
function regWrite(n){ S.R[n]=S.X; }
function regRead(n){ lift(); S.X=S.R[n]; buf=fmt(S.X); fresh=true; }

/* ---------- рендер ---------- */
var STK=['X','Y','Z','T','X1'];
var REG=['R0','R1','R2','R3','R4','R5','R6','R7','R8','R9','Ra','Rb','Rc','Rd'];

function cells(host, labels, values){
  var h='';
  for (var i=0;i<labels.length;i++){
    h += '<div class="cell"><i>'+labels[i]+'</i><b>'+values[i]+'</b></div>';
  }
  host.innerHTML=h;
}

function render(){
  document.getElementById('lcdVal').textContent = buf!==''?buf:fmt(S.X);
  document.getElementById('lcdMode').textContent = prog?('ПРГ '+pad2(PC)):'АВТ';

  var stk=[fmt(S.X),fmt(S.Y),fmt(S.Z),fmt(S.T),fmt(S.X1)];
  var rv=S.R.map(fmt);

  cells(document.getElementById('stackA'),STK,stk);
  cells(document.getElementById('regsA'),REG,rv);
  cells(document.getElementById('stackB'),STK,stk);
  cells(document.getElementById('regsB'),REG,rv);
}

function renderList(){
  var host=document.getElementById('list');
  if (!prog){
    host.innerHTML='<div class="empty">Программа не загружена. Нажми «Пример 5!».</div>';
    document.getElementById('codeTitle').textContent='Программа не загружена';
    return;
  }
  document.getElementById('codeTitle').textContent=prog.title;
  var h='';
  for (var i=0;i<prog.cmds.length;i++){
    var c=prog.cmds[i];
    h+='<div class="row'+(i===PC?' cur':'')+'">'
      +'<span class="a">'+pad2(i)+'</span>'
      +'<span class="c">'+c.c+'</span>'
      +'<span class="t">'+c.t+'</span></div>';
  }
  host.innerHTML=h;
  var cur=host.querySelector('.row.cur');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
}

function logAdd(t){
  var host=document.getElementById('log');
  var d=document.createElement('div');
  d.className='logline';
  d.innerHTML=t;
  host.appendChild(d);
  host.scrollTop=host.scrollHeight;
}

/* ---------- экраны ---------- */
function show(name){
  screenNow=name;
  ORDER.forEach(function(k){
    var el=document.getElementById('s-'+k);
    if (el) el.classList.toggle('on',k===name);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){
    b.classList.toggle('on',b.getAttribute('data-s')===name);
  });
}
function nextScreen(){
  var i=ORDER.indexOf(screenNow);
  show(ORDER[(i+1)%ORDER.length]);
}

/* ---------- пример: факториал ---------- */
function makeFact(n){
  return {
    title:'Факториал '+n+'!',
    init:function(){ for(var i=0;i<14;i++)S.R[i]=0; S.R[0]=n; S.R[1]=1; S.R[2]=n; },
    cmds:[
      {c:'60',t:'П→X 0',f:function(){regRead(0);}},
      {c:'41',t:'X→П 2',f:function(){regWrite(2);}},
      {c:'01',t:'1',f:function(){lift();S.X=1;buf='1';fresh=true;}},
      {c:'41',t:'X→П 1',f:function(){regWrite(1);}},
      {c:'61',t:'П→X 1',f:function(){regRead(1);}},
      {c:'62',t:'П→X 2',f:function(){regRead(2);}},
      {c:'12',t:'×',f:function(){bin('*');}},
      {c:'41',t:'X→П 1',f:function(){regWrite(1);}},
      {c:'62',t:'П→X 2',f:function(){regRead(2);}},
      {c:'01',t:'1',f:function(){lift();S.X=1;buf='1';fresh=true;}},
      {c:'11',t:'−',f:function(){bin('-');}},
      {c:'41',t:'X→П 2',f:function(){regWrite(2);}},
      {c:'5E',t:'F x≠0 → 04',jump:4,cond:function(){return S.R[2]!==0;}},
      {c:'61',t:'П→X 1',f:function(){regRead(1);}},
      {c:'50',t:'С/П',f:function(){halt();}}
    ]
  };
}

/* ---------- шаг ---------- */
function halt(){
  stopAuto(); stopRun();
  logAdd('<b>С/П</b> — остановка. X = '+fmt(S.X));
}
function step(){
  if (!prog){ logAdd('Программа не загружена'); return false; }
  if (PC<0 || PC>=prog.cmds.length){ logAdd('Конец программы'); return false; }

  var cmd=prog.cmds[PC];
  var addr=PC;
  var before=fmt(S.X);

  if (typeof cmd.f==='function') cmd.f();

  if (cmd.jump!==undefined && cmd.cond && cmd.cond()){
    logAdd('['+pad2(addr)+'] '+cmd.t+' · переход → '+pad2(cmd.jump));
    PC=cmd.jump;
  } else {
    logAdd('['+pad2(addr)+'] '+cmd.t+' · X: '+before+' → '+fmt(S.X));
    PC++;
  }

  render(); renderList();
  if (cycle) nextScreen();
  return true;
}

/* ---------- авто / пуск ---------- */
function stopAuto(){
  if (timer){ clearInterval(timer); timer=null; }
  var b=document.getElementById('btnAuto');
  if (b){ b.classList.remove('on'); b.textContent='Авто'; }
}
function toggleAuto(){
  if (timer){ stopAuto(); return; }
  var b=document.getElementById('btnAuto');
  b.classList.add('on'); b.textContent='Стоп';
  timer=setInterval(function(){ if(!step()) stopAuto(); },800);
}
function stopRun(){
  if (runner){ clearInterval(runner); runner=null; }
  var b=document.getElementById('btnRun');
  if (b){ b.classList.remove('on'); b.textContent='Пуск'; }
}
function toggleRun(){
  if (runner){ stopRun(); return; }
  if (!prog){ logAdd('Сначала нажми «Пример 5!»'); return; }
  var b=document.getElementById('btnRun');
  b.classList.add('on'); b.textContent='Стоп';
  runner=setInterval(function(){ if(!step()) stopRun(); },600);
}

/* ---------- клавиатура ---------- */
var KEYS=[
  ['f','k','x→П','П→X','↔','В↑'],
  ['С/П','ПП','БП','В/О','Сх','/−/'],
  ['7','8','9','÷','ВП','F○'],
  ['4','5','6','×','π','√'],
  ['1','2','3','−','x²','1/x'],
  ['0','.','+','x^y','e^x','ln']
];

function buildPad(){
  var pad=document.getElementById('pad'), h='';
  for (var r=0;r<KEYS.length;r++){
    for (var c=0;c<KEYS[r].length;c++){
      var k=KEYS[r][c], cls='';
      if (r===0) cls='dark';
      if (r===1 && (k==='С/П'||k==='Сх')) cls='red';
      if (r>1 && '÷×−+'.indexOf(k)>=0) cls='op';
      h+='<button class="'+cls+'" data-k="'+k+'">'+k+'</button>';
    }
  }
  pad.innerHTML=h;
  pad.addEventListener('click',function(e){
    var b=e.target.closest('button');
    if (!b) return;
    press(b.getAttribute('data-k'));
  });
}

function press(k){
  if (pendReg){
    if (k>='0' && k<='9'){
      var n=+k;
      if (pendReg==='w'){ regWrite(n); logAdd('X → R'+k); }
      else { regRead(n); logAdd('R'+k+' → X'); }
      pendReg=null; render(); return;
    }
    if (k==='a'){ pendReg==='w'?regWrite(10):regRead(10); pendReg=null; render(); return; }
    pendReg=null;
  }

  if (k>='0' && k<='9'){
    if (fresh){ buf=''; fresh=false; }
    if (buf==='0') buf='';
    if (buf.length<10) buf+=k;
    S.X=parseFloat(buf||'0');
    render(); return;
  }
  if (k==='.'){
    if (fresh){ buf='0'; fresh=false; }
    if (buf.indexOf('.')<0) buf+='.';
    S.X=parseFloat(buf||'0');
    render(); return;
  }

  switch(k){
    case '+': bin('+'); break;
    case '−': bin('-'); break;
    case '×': bin('*'); break;
    case '÷': bin('/'); break;
    case 'x^y': bin('^'); break;
    case 'x²': un(function(x){return x*x;}); break;
    case '√': un(function(x){return Math.sqrt(x);}); break;
    case '1/x': un(function(x){return 1/x;}); break;
    case 'ln': un(function(x){return Math.log(x);}); break;
    case 'e^x': un(function(x){return Math.exp(x);}); break;
    case 'π': lift(); S.X=Math.PI; buf=fmt(S.X); fresh=true; break;
    case '/−/': S.X=-S.X; buf=fmt(S.X); fresh=true; break;
    case 'В↑': lift(); break;
    case '↔': var t=S.X; S.X=S.Y; S.Y=t; buf=fmt(S.X); fresh=true; break;
    case 'Сх': S.X=0; buf=''; fresh=true; break;
    case 'x→П': pendReg='w'; logAdd('Нажми номер регистра 0–9'); break;
    case 'П→X': pendReg='r'; logAdd('Нажми номер регистра 0–9'); break;
    case 'ПП': toggleRun(); break;
    case 'С/П': halt(); break;
    case 'В/О': stopRun(); stopAuto(); PC=0; render(); renderList(); logAdd('В/О: PC = 00'); break;
    case 'ВП': if(fresh){buf='1';fresh=false;} if(buf.indexOf('e')<0) buf+='e'; S.X=parseFloat(buf.replace('e','e'))||0; break;
    case 'f': case 'k': logAdd('Слой '+k+' появится на этапе программ'); break;
    case 'БП': logAdd('БП — на этапе ввода программ'); break;
    case 'F○': logAdd('F○ — на этапе ввода программ'); break;
    default: logAdd('Клавиша '+k+' пока не работает');
  }
  render();
}

/* ---------- запуск ---------- */
function init(){
  buildPad();
  render(); renderList();

  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){
    b.addEventListener('click',function(){ show(b.getAttribute('data-s')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.modes button'),function(b){
    b.addEventListener('click',function(){
      Array.prototype.forEach.call(document.querySelectorAll('.modes button'),function(x){x.classList.remove('on');});
      b.classList.add('on');
      document.body.className=b.getAttribute('data-mode');
    });
  });

  document.getElementById('btnStep').addEventListener('click',function(){ step(); });
  document.getElementById('btnAuto').addEventListener('click',toggleAuto);
  document.getElementById('btnRun').addEventListener('click',toggleRun);

  document.getElementById('btnCycle').addEventListener('click',function(){
    cycle=!cycle;
    this.textContent = cycle?'Экраны: шаг':'Экраны: вручную';
  });

  document.getElementById('btnZero').addEventListener('click',function(){
    stopAuto(); stopRun(); PC=0;
    S.X=S.Y=S.Z=S.T=S.X1=0; buf=''; fresh=true;
    if (prog && prog.init) prog.init();
    render(); renderList(); logAdd('Сброс: PC = 00');
  });

  document.getElementById('btnDemo').addEventListener('click',function(){
    stopAuto(); stopRun();
    prog=makeFact(5);
    prog.init();
    PC=0; buf=''; fresh=true;
    render(); renderList();
    logAdd('Загружено: '+prog.title);
    show('code');
  });
}

if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
</body>
</html>
