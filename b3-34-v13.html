<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Электроника Б3-34 — v13</title>
<meta name="theme-color" content="#F6F5F1">
<link rel="stylesheet" href="b3-34.css?v=3">
<style>
body{padding-bottom:210px}
#pnl{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#F6F5F1;border-top:1px solid #DAD7CE;padding:8px 10px calc(10px + env(safe-area-inset-bottom));font:14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pStep{display:flex;align-items:center;gap:8px;font-size:13px;color:#6B6B6B}
.pBar{flex:1;height:4px;background:#DEDAD0;border-radius:2px;overflow:hidden}
.pBar i{display:block;height:100%;width:0;background:#2E7D32;transition:width .15s}
.pRow{display:flex;gap:6px;margin-top:6px}
.pRow button{flex:1;padding:11px 4px;border:1px solid #DCD8CE;border-radius:10px;background:#fff;color:#222;font:inherit;font-size:14px}
.pRow button.on{background:#2E7D32;color:#fff;border-color:#2E7D32}
.pRow button:active{opacity:.85}
#mMenu{flex:0 0 46px}
#scrCode,#scrLog{margin-top:10px}
.lst{background:#fff;border:1px solid #DCD8CE;border-radius:10px;padding:8px 10px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;max-height:68vh;overflow:auto;white-space:pre-wrap}
#logBox{font-size:12px}
#scrReg{padding:0 10px}
</style>
</head>
<body>
<div class="wrap">

  <div class="case" id="case">
    <div class="brand"><span>ЭЛЕКТРОНИКА</span><b>Б3-34 · v13</b></div>
    <div class="lcdbox">
      <div class="lcd" id="lcd">0</div>
      <div class="lcdrow"><span id="lMode">АВТ</span><span id="lAddr"></span><span id="lPref"></span></div>
    </div>
    <div class="stack" id="stack"></div>
    <div class="regs" id="regs"></div>
    <div class="pad" id="pad"></div>
    <div class="panel" id="panel" style="display:none"></div>
  </div>

  <div class="tools" id="tools" style="display:none">
    <button id="btnRun">▶ Пуск программы</button>
    <button id="btnStop">⏹ Стоп</button>
    <button id="btnSpeed">🐢 Темп: оригинал</button>
    <button id="btnSound">🔊 Звук: вкл</button>
    <button id="btnVoice">🗣 Голос: вкл</button>
    <button id="btnMic">🎤 Сказать</button>
    <button id="btnReset">⏻ Сброс</button>
    <button id="btnHelp">❓ Справка</button>
    <button id="btnSaveProg">💾 Сохранить</button>
    <button id="btnImportFile">⬆ Загрузить</button>
    <button id="btnExportJson">⬇ JSON</button>
    <button id="btnExportTxt">⬇ TXT</button>
    <input type="file" id="fileInput" style="display:none">
  </div>

  <div class="hint" id="hint">Сначала число, затем В↑ и второе число, потом операция. Например 5 В↑ 3 + → 8.</div>

  <div id="scrReg" style="display:none"></div>
  <div id="scrCode" style="display:none"><div class="lst" id="codeBox">Программа ещё не набиралась.</div></div>
  <div id="scrLog" style="display:none"><div class="lst" id="logBox">Пока пусто — сделай несколько шагов.</div></div>

</div>

<div id="pnl">
  <div class="pStep"><span id="pStepTxt">шаг 0</span><div class="pBar"><i id="pBarFill"></i></div><span id="pPc">PC — / —</span></div>
  <div class="pRow">
    <button id="mWork">Работа</button>
    <button id="mStudy" class="on">Учёба</button>
    <button id="mMenu">☰</button>
  </div>
  <div class="pRow">
    <button data-scr="num" class="on">Числа</button>
    <button data-scr="reg">Регистры</button>
    <button data-scr="code">Код</button>
    <button data-scr="log">Журнал</button>
  </div>
  <div class="pRow" id="pCtl"></div>
</div>

<script src="b3-34.js"></script>
<script>
(function(){
"use strict";

var caseEl   = document.getElementById('case');
var stackEl  = document.getElementById('stack');
var regsEl   = document.getElementById('regs');
var padEl    = document.getElementById('pad');
var scrReg   = document.getElementById('scrReg');
var scrCode  = document.getElementById('scrCode');
var scrLog   = document.getElementById('scrLog');
var pStepTxt = document.getElementById('pStepTxt');
var pPc      = document.getElementById('pPc');
var pBar     = document.getElementById('pBarFill');
var pCtl     = document.getElementById('pCtl');

var mode = 'study';
var scr  = 'num';
var steps = 0;
var total = 0;
var auto = false;

/* ---------- нажатие клавиши корпуса по подписи ---------- */
function key(t){
  var bs = document.querySelectorAll('#pad .key');
  for(var i = 0; i < bs.length; i++){
    if(bs[i].textContent.trim() === t){ bs[i].click(); return true; }
  }
  return false;
}

/* ---------- таблица команд для листинга ---------- */
var CMD = {
  0x0A:'·',0x0B:'/-/',0x0C:'ВП',0x0D:'Cx',0x0E:'В↑',0x0F:'Вx',
  0x10:'+',0x11:'−',0x12:'×',0x13:'÷',0x14:'↔',
  0x15:'10^x',0x16:'e^x',0x17:'lg',0x18:'ln',
  0x19:'arcsin',0x1A:'arccos',0x1B:'arctg',0x1C:'sin',0x1D:'cos',0x1E:'tg',
  0x20:'π',0x21:'√',0x22:'x²',0x23:'1/x',0x24:'x^y',0x25:'F◯',
  0x50:'С/П',0x51:'БП',0x52:'В/О',0x53:'ПП',0x54:'К НОП',
  0x57:'F x≠0',0x58:'F L2',0x59:'F x≥0',0x5A:'F L3',0x5B:'F L1',0x5C:'F x<0',0x5D:'F L0',0x5E:'F x=0'
};
var RN = '0123456789abcd';

function nm(c){
  if(c >= 0 && c <= 9) return String(c);
  if(CMD[c]) return CMD[c];
  if(c >= 0x40 && c <= 0x4D) return 'X→П ' + RN[c & 15];
  if(c >= 0x60 && c <= 0x6D) return 'П→X ' + RN[c & 15];
  if(c >= 0x70 && c <= 0x7D) return 'К x≠0 ' + RN[c & 15];
  if(c >= 0x80 && c <= 0x8D) return 'К БП ' + RN[c & 15];
  if(c >= 0x90 && c <= 0x9D) return 'К x≥0 ' + RN[c & 15];
  if(c >= 0xA0 && c <= 0xAD) return 'К ПП ' + RN[c & 15];
  if(c >= 0xB0 && c <= 0xBD) return 'К X→П ' + RN[c & 15];
  if(c >= 0xC0 && c <= 0xCD) return 'К x<0 ' + RN[c & 15];
  if(c >= 0xD0 && c <= 0xDD) return 'К П→X ' + RN[c & 15];
  if(c >= 0xE0 && c <= 0xED) return 'К x=0 ' + RN[c & 15];
  return '?';
}
function isJump(c){
  return c === 0x51 || c === 0x53 ||
         c === 0x57 || c === 0x59 || c === 0x5C || c === 0x5E ||
         c === 0x5D || c === 0x5B || c === 0x58 || c === 0x5A;
}
function p2(n){ return (n < 10 ? '0' : '') + n; }
function hx(c){ var s = (c & 255).toString(16).toUpperCase(); return s.length < 2 ? '0' + s : s; }

/* Программу ядро хранит в памяти браузера — оттуда и берём листинг */
function readProg(){
  try{
    var raw = localStorage.getItem('b334.state.v3');
    if(!raw) return null;
    var o = JSON.parse(raw);
    return (o && Array.isArray(o.prog)) ? o.prog : null;
  }catch(e){ return null; }
}

function buildCode(){
  var box = document.getElementById('codeBox');
  var p = readProg();
  if(!p){ total = 0; box.textContent = 'Программа ещё не набиралась.'; return; }
  var last = -1;
  for(var i = 0; i < 98; i++){ if(p[i] !== 0x54) last = i; }
  total = last + 1;
  if(last < 0){
    box.textContent = 'Программа пуста. Набери её в режиме ПРГ (f → ПРГ) и вернись сюда.';
    return;
  }
  var addr = {};
  for(var k = 0; k <= last; k++){ if(isJump(p[k])){ addr[k + 1] = 1; addr[k + 2] = 1; } }
  var out = [];
  for(var j = 0; j <= last; j++){
    if(addr[j]) out.push(p2(j) + ': ' + (p[j] & 15) + '   цифра адреса');
    else out.push(p2(j) + ': ' + hx(p[j]) + '   ' + nm(p[j]));
  }
  box.textContent = out.join('\n');
}

/* ---------- журнал изменений ---------- */
var log = [];
var lastVals = '';
function pushLog(){
  var s = document.getElementById('stack');
  if(!s) return;
  var t = s.textContent.replace(/\s+/g, ' ').trim();
  if(!t || t === lastVals) return;
  lastVals = t;
  log.push(t);
  if(log.length > 200) log.shift();
  var box = document.getElementById('logBox');
  if(box) box.textContent = log.join('\n');
}

/* ---------- счётчик ---------- */
function upd(){
  pStepTxt.textContent = 'шаг ' + steps;
  pPc.textContent = 'PC — / ' + (total ? total : '—');
  var w = total ? Math.min(100, steps / total * 100) : 0;
  pBar.style.width = w + '%';
}

/* ---------- экраны ---------- */
function showScr(name){
  scr = name;

  if(name === 'reg'){
    caseEl.style.display = 'none';
    scrReg.style.display = '';
    scrReg.appendChild(stackEl);
    scrReg.appendChild(regsEl);
  }else{
    if(stackEl.parentNode !== caseEl){
      caseEl.insertBefore(regsEl, padEl);
      caseEl.insertBefore(stackEl, regsEl);
    }
    caseEl.style.display = '';
    scrReg.style.display = 'none';
  }

  scrCode.style.display = (name === 'code') ? '' : 'none';
  scrLog.style.display  = (name === 'log')  ? '' : 'none';
  if(name === 'code') buildCode();
  if(name === 'log'){
    var box = document.getElementById('logBox');
    if(box && !log.length) box.textContent = 'Пока пусто — сделай несколько шагов.';
  }

  var bs = document.querySelectorAll('.pRow [data-scr]');
  for(var i = 0; i < bs.length; i++){
    bs[i].className = (bs[i].getAttribute('data-scr') === name) ? 'on' : '';
  }
  upd();
}

/* ---------- действия ---------- */
function doStep(){
  key('ПП');
  steps++;
  setTimeout(pushLog, 30);
  upd();
}
function doAuto(){
  auto = true;
  document.getElementById('btnRun').click();
  document.getElementById('btnStop').className = '';
}
function doStop(){
  auto = false;
  document.getElementById('btnStop').click();
  buildCode();
  upd();
}
function doRun(){
  auto = true;
  document.getElementById('btnRun').click();
  setTimeout(buildCode, 400);
}
function doSpeed(){
  document.getElementById('btnSpeed').click();
}
function doZero(){
  key('В/О');
  steps = 0;
  pushLog();
  upd();
}
function doClear(){
  auto = false;
  document.getElementById('btnReset').click();
  steps = 0;
  lastVals = '';
  log = [];
  var box = document.getElementById('logBox');
  if(box) box.textContent = 'Пока пусто — сделай несколько шагов.';
  buildCode();
  upd();
}

function btn(text, fn){
  var b = document.createElement('button');
  b.textContent = text;
  b.addEventListener('click', fn);
  pCtl.appendChild(b);
}

function doMenu(){
  pCtl.innerHTML = '';
  btn('Темп', function(){ doSpeed(); doMenu(); });
  btn('Справка', function(){
    alert('Клавиши: f и k открывают слои.\nВ режиме ПРГ (f → ПРГ) каждая клавиша пишет свой код, переходы занимают три ячейки.\n\nУчёба: Шаг — одна команда, Авто — прогон, 00 — на адрес 00.\nРабота: Пуск, Темп, Стоп, Сброс.\n\nЭкраны: Регистры показывает те же значения, что в корпусе; Код и Журнал — листинг и история шагов.');
    doMenu();
  });
  btn('Назад', function(){ drawCtl(); });
}

function drawCtl(){
  pCtl.innerHTML = '';
  if(mode === 'study'){
    btn('▶ Шаг', doStep);
    btn('Авто', doAuto);
    btn('00', doZero);
    btn('Очистить', doClear);
    btn('⋯', doMenu);
  }else{
    btn('▶ Пуск', doRun);
    btn('Темп', doSpeed);
    btn('Стоп', doStop);
    btn('Сброс', doClear);
    btn('⋯', doMenu);
  }
}

function setMode(m){
  mode = m;
  document.getElementById('mWork').className  = (m === 'work')  ? 'on' : '';
  document.getElementById('mStudy').className = (m === 'study') ? 'on' : '';
  drawCtl();
}

/* ---------- привязки ---------- */
document.getElementById('mWork').addEventListener('click', function(){ setMode('work'); });
document.getElementById('mStudy').addEventListener('click', function(){ setMode('study'); });
document.getElementById('mMenu').addEventListener('click', function(){
  alert('Библиотека программ появится следующим шагом. Сейчас — Тема, Темп и Справка.');
});
var scrs = document.querySelectorAll('.pRow [data-scr]');
for(var i = 0; i < scrs.length; i++){
  scrs[i].addEventListener('click', function(){
    showScr(this.getAttribute('data-scr'));
  });
}

/* ---------- наблюдение за ходом программы ---------- */
setInterval(function(){
  if(auto){
    var s = document.getElementById('stack');
    if(s && s.textContent.replace(/\s+/g,' ').trim() !== lastVals){
      steps++;
      pushLog();
      upd();
    }
  }
}, 250);

setInterval(function(){
  if(scr === 'code') buildCode();
}, 1200);

/* ---------- старт ---------- */
buildCode();
drawCtl();
showScr('num');
upd();

})();
</script>
</body>
</html>
